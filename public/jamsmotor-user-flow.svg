      .lane-sub{font:400 14px Inter,Arial,sans-serif;fill:#64748B}
      .node-title{font:700 16px Inter,Arial,sans-serif;fill:#172033;text-anchor:middle}
      .node-copy{font:400 13px Inter,Arial,sans-serif;fill:#526077;text-anchor:middle}
