      .legend{font:500 13px Inter,Arial,sans-serif;fill:#526077}
      .line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
      .line-dash{fill:none;stroke:#94A3B8;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow)}
